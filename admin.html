<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel | L2K TOP UP STORE</title>

<style>
body{background:#07101e;color:#fff}
.admin-wrap{width:min(980px,calc(100% - 24px));margin:30px auto 70px}
.admin-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.admin-card{background:#0d1728;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:20px;box-shadow:0 18px 40px rgba(0,0,0,.25);margin-bottom:18px}
.admin-card h2{margin-top:0}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.admin-list{display:grid;gap:12px}
.game-row{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:#0a1322;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:12px}
.game-thumb{width:72px;height:72px;border-radius:14px;background:#14223a center/cover no-repeat;display:grid;place-items:center;font-size:28px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.small-btn{border:0;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}
.save{background:#1ab7ff;color:#04101a}.danger{background:#ff5d7d;color:#fff}.muted{background:#18263c;color:#d6e2f3}
.status{font-size:12px;color:#8fa3bc}
@media(max-width:650px){.admin-grid{grid-template-columns:1fr}.game-row{grid-template-columns:58px 1fr}.game-thumb{width:58px;height:58px}.row-actions{grid-column:1/-1}}

/* ===== L2K Global Animations ===== */
html{scroll-behavior:smooth}
body{overflow-x:hidden}
@keyframes l2kFadeUp{
  from{opacity:0;transform:translateY(26px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes l2kFadeIn{
  from{opacity:0}
  to{opacity:1}
}
@keyframes l2kFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
@keyframes l2kPulseGlow{
  0%,100%{box-shadow:0 0 0 rgba(33,199,255,0)}
  50%{box-shadow:0 0 30px rgba(33,199,255,.24)}
}
@keyframes l2kShine{
  0%{transform:translateX(-140%) rotate(18deg)}
  100%{transform:translateX(240%) rotate(18deg)}
}
@keyframes l2kGradientMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@keyframes l2kSpinSlow{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
.l2k-reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.l2k-reveal.l2k-visible{opacity:1;transform:none}
.l2k-stagger>*{opacity:0;transform:translateY(18px)}
.l2k-stagger.l2k-visible>*{animation:l2kFadeUp .65s ease forwards}
.l2k-stagger.l2k-visible>*:nth-child(2){animation-delay:.08s}
.l2k-stagger.l2k-visible>*:nth-child(3){animation-delay:.16s}
.l2k-stagger.l2k-visible>*:nth-child(4){animation-delay:.24s}
.l2k-stagger.l2k-visible>*:nth-child(5){animation-delay:.32s}
.l2k-stagger.l2k-visible>*:nth-child(6){animation-delay:.40s}
.brand-mark,.brand-logo,.logo-big{animation:l2kFloat 4s ease-in-out infinite}
.btn,.small-btn,.google-btn,.login-btn,.submit,.play-btn,.game-card,.card,.dark-card,.product-card,.reason-card,.reseller-card,.contact-box,.admin-card{
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease,filter .22s ease
}
.btn:hover,.small-btn:hover,.google-btn:hover,.login-btn:hover,.submit:hover,.play-btn:hover{
  transform:translateY(-2px) scale(1.01)
}
.game-card:hover,.card:hover,.dark-card:hover,.product-card:hover,.reason-card:hover,.reseller-card:hover,.contact-box:hover,.admin-card:hover{
  transform:translateY(-6px)
}
.hero h1,.page-hero h1,.game-center-hero h1,.right h1{
  animation:l2kFadeUp .8s ease both
}
.hero p,.page-hero p,.game-center-hero p{
  animation:l2kFadeIn 1s ease .18s both
}
.hero .eyebrow,.gc-pill{
  animation:l2kPulseGlow 2.8s ease-in-out infinite
}
.hero::before{animation:l2kFloat 7s ease-in-out infinite}
.hero::after{animation:l2kFloat 5s ease-in-out infinite reverse}
.btn-primary,.login-btn,.submit,.play-btn,.code-btn{
  background-size:200% 200%!important;
  animation:l2kGradientMove 5s ease infinite
}
.icon-box,.round-icon,.mini-icon,.lb-icon,.contact-dot{
  animation:l2kFloat 4.5s ease-in-out infinite
}
.game-cover,.product-visual,.banner,.hero,.game-center-hero{
  position:relative;
  overflow:hidden
}
.game-cover::after,.product-visual::after,.banner::after,.game-center-hero::after{
  content:"";position:absolute;top:-30%;left:-35%;width:28%;height:160%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  transform:rotate(18deg);
  animation:l2kShine 6s ease-in-out infinite;
  pointer-events:none
}
.avatar{animation:l2kPulseGlow 3s ease-in-out infinite}
input:focus,select:focus,textarea:focus{
  transform:translateY(-1px);
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease
}
.navbar,.topbar{
  animation:l2kFadeIn .5s ease both
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .l2k-reveal,.l2k-stagger>*{opacity:1!important;transform:none!important}
}

</style>

</head><body>
<div class="admin-wrap">
  <div class="admin-head"><div><h1 style="margin:0">L2K Admin Panel</h1><div class="status">Manage game cards & logos</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a href="index.html" style="color:#55d5ff">← Website</a><a href="profile.html" style="color:#55d5ff">My Profile</a></div></div>

  
  <div class="admin-card">
    <h2>Website Logo</h2>
    <p class="status">Upload the logo used instead of the L2K text badge across the website.</p>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div id="logoPreview" class="game-thumb">L2K</div>
      <input id="siteLogoFile" type="file" accept="image/*">
      <button id="uploadSiteLogo" class="small-btn save">Upload Website Logo</button>
    </div>
    <div id="logoMsg" class="status" style="margin-top:10px"></div>
  </div>

<div class="admin-card">
    <h2>Add New Game</h2>
    <div class="admin-grid">
      <div><label>Game Name</label><input id="name" placeholder="e.g. Free Fire MAX"></div>
      <div><label>Page Link</label><input id="link" placeholder="freefire.html"></div>
      <div><label>Order Number</label><input id="order" type="number" value="10"></div>
      <div><label>Active</label><select id="active"><option value="true">Active</option><option value="false">Inactive</option></select></div>
      <div style="grid-column:1/-1"><label>Game Logo / Cover</label><input id="image" type="file" accept="image/*"></div>
    </div>
    <button id="addGame" class="small-btn save" style="margin-top:14px">Add Game</button>
    <div id="msg" class="status" style="margin-top:10px"></div>
  </div>

  <div class="admin-card">
    <h2>Existing Games</h2>
    <div id="gameList" class="admin-list"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";

const firebaseConfig = {"apiKey": "AIzaSyCvRetnbUARMXnMQ2UI9ksiFNdpbLIuIMQ", "authDomain": "l2k-top-up-store-lkr.firebaseapp.com", "projectId": "l2k-top-up-store-lkr", "storageBucket": "l2k-top-up-store-lkr.firebasestorage.app", "messagingSenderId": "722986740809", "appId": "1:722986740809:web:bcb97c3d5c2106d4b1a398"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const msg = document.getElementById("msg");
const gameList = document.getElementById("gameList");

async function uploadImage(file){
  if(!file) return "";
  const safe = Date.now() + "-" + file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const storageRef = ref(storage, "game-logos/" + safe);
  await uploadBytes(storageRef, file);
  return await getDownloadURL(storageRef);
}

async function refresh(){
  gameList.innerHTML = "Loading...";
  try{
    const snap = await getDocs(query(collection(db,"games"), orderBy("order")));
    gameList.innerHTML = "";
    if(snap.empty){
      gameList.innerHTML = '<div class="status">No games yet. Add your first game above.</div>';
      return;
    }
    snap.forEach(d=>{
      const g = d.data();
      const row = document.createElement("div");
      row.className = "game-row";
      row.innerHTML = `
        <div class="game-thumb" style='background-image:url("${g.image||""}")'>${g.image ? "" : "🎮"}</div>
        <div>
          <input class="edit-name" value="${(g.name||"").replace(/"/g,"&quot;")}" style="margin-bottom:7px">
          <input class="edit-link" value="${(g.link||"#").replace(/"/g,"&quot;")}" style="margin-bottom:7px">
          <input class="edit-order" type="number" value="${g.order||0}">
          <div class="status">${g.active===false ? "Inactive" : "Active"}</div>
        </div>
        <div class="row-actions">
          <input class="replace-image" type="file" accept="image/*" style="max-width:180px">
          <button class="small-btn save">Save</button>
          <button class="small-btn muted">Toggle Active</button>
          <button class="small-btn danger">Delete</button>
        </div>`;
      const [saveBtn,toggleBtn,deleteBtn] = row.querySelectorAll("button");
      saveBtn.onclick = async()=>{
        try{
          let image = g.image || "";
          const file = row.querySelector(".replace-image").files[0];
          if(file) image = await uploadImage(file);
          await updateDoc(doc(db,"games",d.id), {
            name: row.querySelector(".edit-name").value.trim(),
            link: row.querySelector(".edit-link").value.trim() || "#",
            order: Number(row.querySelector(".edit-order").value || 0),
            image,
            updatedAt: serverTimestamp()
          });
          msg.textContent = "Saved successfully.";
          refresh();
        }catch(e){msg.textContent = "Save failed: " + e.message}
      };
      toggleBtn.onclick = async()=>{
        try{await updateDoc(doc(db,"games",d.id), {active: g.active===false ? true : false}); refresh();}
        catch(e){msg.textContent = "Toggle failed: " + e.message}
      };
      deleteBtn.onclick = async()=>{
        if(!confirm("Delete this game?")) return;
        try{await deleteDoc(doc(db,"games",d.id)); refresh();}
        catch(e){msg.textContent = "Delete failed: " + e.message}
      };
      gameList.appendChild(row);
    });
  }catch(e){gameList.innerHTML = '<div class="status">Load failed: '+e.message+'</div>';}
}

document.getElementById("addGame").onclick = async()=>{
  const name = document.getElementById("name").value.trim();
  if(!name){msg.textContent="Enter a game name.";return;}
  try{
    msg.textContent = "Uploading...";
    const image = await uploadImage(document.getElementById("image").files[0]);
    await addDoc(collection(db,"games"), {
      name,
      link: document.getElementById("link").value.trim() || "#",
      order: Number(document.getElementById("order").value || 0),
      active: document.getElementById("active").value === "true",
      image,
      createdAt: serverTimestamp()
    });
    msg.textContent = "Game added.";
    document.getElementById("name").value="";
    document.getElementById("link").value="";
    document.getElementById("image").value="";
    refresh();
  }catch(e){msg.textContent="Add failed: "+e.message}
};


async function loadSiteLogoAdmin(){
  try{
    const snap = await getDoc(doc(db,"siteSettings","general"));
    if(snap.exists() && snap.data().logoUrl){
      const p = document.getElementById("logoPreview");
      p.style.backgroundImage = `url("${snap.data().logoUrl}")`;
      p.textContent = "";
    }
  }catch(e){}
}
document.getElementById("uploadSiteLogo").onclick = async()=>{
  const file = document.getElementById("siteLogoFile").files[0];
  const logoMsg = document.getElementById("logoMsg");
  if(!file){ logoMsg.textContent = "Choose a logo image first."; return; }
  try{
    logoMsg.textContent = "Uploading...";
    const r = ref(storage,"site-assets/logo-"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_"));
    await uploadBytes(r,file);
    const logoUrl = await getDownloadURL(r);
    await setDoc(doc(db,"siteSettings","general"), {logoUrl, updatedAt: serverTimestamp()}, {merge:true});
    logoMsg.textContent = "Website logo updated.";
    loadSiteLogoAdmin();
  }catch(e){ logoMsg.textContent = "Logo upload failed: "+e.message; }
};
loadSiteLogoAdmin();

refresh();
</script>

<script>
(function(){
  const selectors = [
    '.section','.banner','.card','.dark-card','.product-card','.form-wrap',
    '.contact-box','.faq','.reason-card','.reseller-card','.cta-box','.leaderboard',
    '.app-box','.auth-card','.admin-card','.hero-content','.page-hero .container',
    '.game-center-hero','.games-grid','.profile-head'
  ];
  const nodes = [];
  selectors.forEach(sel=>{
    document.querySelectorAll(sel).forEach(el=>{
      if(!el.classList.contains('l2k-reveal')) {
        el.classList.add('l2k-reveal');
        nodes.push(el);
      }
    });
  });

  document.querySelectorAll('.service-grid,.dark-cards,.product-grid,.games-grid,.reason-grid,.reseller-grid,.podium,.stats')
    .forEach(el=>el.classList.add('l2k-stagger'));

  const reveal = (el)=>el.classList.add('l2k-visible');
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        reveal(entry.target);
        io.unobserve(entry.target);
      }
    });
  },{threshold:.12,rootMargin:'0px 0px -40px 0px'}) : null;

  document.querySelectorAll('.l2k-reveal,.l2k-stagger').forEach(el=>{
    if(io) io.observe(el); else reveal(el);
  });

  // Ripple click effect on interactive controls
  document.querySelectorAll('button,.btn,.small-btn,.google-btn,.login-btn,.submit,.play-btn').forEach(btn=>{
    btn.addEventListener('click',function(e){
      const r=document.createElement('span');
      const rect=this.getBoundingClientRect();
      const size=Math.max(rect.width,rect.height)*1.4;
      r.style.cssText=`position:absolute;width:${size}px;height:${size}px;border-radius:50%;background:rgba(255,255,255,.25);left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px;transform:scale(0);animation:l2kRipple .55s ease-out;pointer-events:none;`;
      const oldPos=getComputedStyle(this).position;
      if(oldPos==='static') this.style.position='relative';
      this.style.overflow='hidden';
      this.appendChild(r);
      setTimeout(()=>r.remove(),600);
    });
  });

  const style=document.createElement('style');
  style.textContent='@keyframes l2kRipple{to{transform:scale(1);opacity:0}}';
  document.head.appendChild(style);
})();
</script>

</body></html>
