<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | L2K TOP UP STORE</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  background:linear-gradient(180deg,#f3f7fb,#edf3f8);
  color:#111827;min-height:100vh
}
.topbar{
  height:68px;background:#fff;border-bottom:1px solid #e6ebf1;
  display:flex;align-items:center;justify-content:space-between;padding:0 22px
}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}
.brand-logo{width:40px;height:40px;border-radius:12px;background:#0b1424;color:#fff;display:grid;place-items:center;font-size:12px}
.home-link{text-decoration:none;color:#2563eb;font-weight:800}
.page{
  min-height:calc(100vh - 68px);display:grid;place-items:center;padding:40px 14px
}
.auth-card{
  width:min(1040px,100%);display:grid;grid-template-columns:.9fr 1.1fr;
  background:#fff;border-radius:24px;overflow:hidden;
  box-shadow:0 28px 70px rgba(43,78,120,.16);border:1px solid #e7ecf3
}
.left{
  min-height:560px;position:relative;background:linear-gradient(180deg,#2680ef,#1d5ed1);
  color:#fff;padding:42px 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden
}
.left:before,.left:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
.left:before{right:-50px;top:-50px} .left:after{left:-70px;bottom:-70px}
.logo-big{width:78px;height:78px;border-radius:18px;background:#fff;color:#111827;display:grid;place-items:center;font-weight:950;z-index:1;box-shadow:0 12px 28px rgba(0,0,0,.18)}
.left h2{font-size:20px;margin:22px 0 6px;z-index:1}
.left p{color:#dbeafe;max-width:300px;line-height:1.65;z-index:1}
.benefits{width:100%;max-width:300px;margin-top:26px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px 16px;text-align:left;z-index:1}
.benefit{padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.benefit:last-child{border-bottom:0}
.right{padding:48px 48px;display:flex;flex-direction:column;justify-content:center}
.right h1{text-align:center;font-size:30px;margin:0 0 7px}
.sub{text-align:center;color:#8b95a4;font-size:14px;margin-bottom:26px}
.field{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:800;color:#4b5563;margin-bottom:7px}
.input-wrap{position:relative}
input{width:100%;height:48px;border:1px solid #dce3ec;border-radius:11px;padding:0 13px;outline:none;background:#fff}
input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.10)}
.eye{position:absolute;right:13px;top:50%;transform:translateY(-50%);cursor:pointer;color:#94a3b8}
.options{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:12px;margin:4px 0 18px}
.remember{display:flex;align-items:center;gap:7px;color:#667085}
.remember input{width:auto;height:auto}
.forgot{color:#1683e9;text-decoration:none;font-weight:800}
.login-btn{width:100%;height:48px;border:0;border-radius:11px;background:linear-gradient(90deg,#2289ef,#155fc9);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 10px 24px rgba(30,112,220,.20)}
.divider{display:flex;align-items:center;gap:12px;color:#a3adba;font-size:11px;margin:22px 0}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:#e5e9ef}
.google-btn{width:100%;height:48px;border:1px solid #dce3ec;border-radius:11px;background:#fff;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.register{text-align:center;color:#7c8797;font-size:13px;margin-top:20px}
.register a{color:#1683e9;text-decoration:none;font-weight:800}
.msg{display:none;margin-top:13px;padding:10px 12px;border-radius:10px;font-size:12px}
.msg.ok{display:block;background:#ecfdf5;color:#047857}
.msg.err{display:block;background:#fff1f2;color:#be123c}
@media(max-width:760px){.auth-card{grid-template-columns:1fr}.left{min-height:330px;padding:30px 22px}.right{padding:30px 20px}}

.google-btn svg{width:18px;height:18px;flex:0 0 18px;display:block}
.google-btn span{display:inline-block}


/* ===== L2K Global Animations ===== */
html{scroll-behavior:smooth}
body{overflow-x:hidden}
@keyframes l2kFadeUp{
  from{opacity:0;transform:translateY(26px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes l2kFadeIn{
  from{opacity:0}
  to{opacity:1}
}
@keyframes l2kFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
@keyframes l2kPulseGlow{
  0%,100%{box-shadow:0 0 0 rgba(33,199,255,0)}
  50%{box-shadow:0 0 30px rgba(33,199,255,.24)}
}
@keyframes l2kShine{
  0%{transform:translateX(-140%) rotate(18deg)}
  100%{transform:translateX(240%) rotate(18deg)}
}
@keyframes l2kGradientMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@keyframes l2kSpinSlow{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
.l2k-reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.l2k-reveal.l2k-visible{opacity:1;transform:none}
.l2k-stagger>*{opacity:0;transform:translateY(18px)}
.l2k-stagger.l2k-visible>*{animation:l2kFadeUp .65s ease forwards}
.l2k-stagger.l2k-visible>*:nth-child(2){animation-delay:.08s}
.l2k-stagger.l2k-visible>*:nth-child(3){animation-delay:.16s}
.l2k-stagger.l2k-visible>*:nth-child(4){animation-delay:.24s}
.l2k-stagger.l2k-visible>*:nth-child(5){animation-delay:.32s}
.l2k-stagger.l2k-visible>*:nth-child(6){animation-delay:.40s}
.brand-mark,.brand-logo,.logo-big{animation:l2kFloat 4s ease-in-out infinite}
.btn,.small-btn,.google-btn,.login-btn,.submit,.play-btn,.game-card,.card,.dark-card,.product-card,.reason-card,.reseller-card,.contact-box,.admin-card{
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease,filter .22s ease
}
.btn:hover,.small-btn:hover,.google-btn:hover,.login-btn:hover,.submit:hover,.play-btn:hover{
  transform:translateY(-2px) scale(1.01)
}
.game-card:hover,.card:hover,.dark-card:hover,.product-card:hover,.reason-card:hover,.reseller-card:hover,.contact-box:hover,.admin-card:hover{
  transform:translateY(-6px)
}
.hero h1,.page-hero h1,.game-center-hero h1,.right h1{
  animation:l2kFadeUp .8s ease both
}
.hero p,.page-hero p,.game-center-hero p{
  animation:l2kFadeIn 1s ease .18s both
}
.hero .eyebrow,.gc-pill{
  animation:l2kPulseGlow 2.8s ease-in-out infinite
}
.hero::before{animation:l2kFloat 7s ease-in-out infinite}
.hero::after{animation:l2kFloat 5s ease-in-out infinite reverse}
.btn-primary,.login-btn,.submit,.play-btn,.code-btn{
  background-size:200% 200%!important;
  animation:l2kGradientMove 5s ease infinite
}
.icon-box,.round-icon,.mini-icon,.lb-icon,.contact-dot{
  animation:l2kFloat 4.5s ease-in-out infinite
}
.game-cover,.product-visual,.banner,.hero,.game-center-hero{
  position:relative;
  overflow:hidden
}
.game-cover::after,.product-visual::after,.banner::after,.game-center-hero::after{
  content:"";position:absolute;top:-30%;left:-35%;width:28%;height:160%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  transform:rotate(18deg);
  animation:l2kShine 6s ease-in-out infinite;
  pointer-events:none
}
.avatar{animation:l2kPulseGlow 3s ease-in-out infinite}
input:focus,select:focus,textarea:focus{
  transform:translateY(-1px);
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease
}
.navbar,.topbar{
  animation:l2kFadeIn .5s ease both
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .l2k-reveal,.l2k-stagger>*{opacity:1!important;transform:none!important}
}

</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="brand-logo">L2K</div>L2K TOP UP STORE</div>
  <a class="home-link" href="index.html">← Home</a>
</div>

<div class="page">
  <div class="auth-card">
    <section class="left">
      <div class="logo-big">L2K</div>
      <h2>Join thousands of users enjoying</h2>
      <p>fast & secure top-ups with L2K TOP UP STORE.</p>

      <div class="benefits">
        <div class="benefit">⚡ Instant Transactions</div>
        <div class="benefit">🔒 Secure & Protected</div>
        <div class="benefit">🕘 24/7 Support</div>
      </div>
    </section>

    <section class="right">
      <h1>Welcome Back!</h1>
      <div class="sub">Log in to continue to L2K TOP UP STORE</div>

      <div class="field">
        <label>Username or Email</label>
        <input id="email" type="email" placeholder="Enter username or email">
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <input id="password" type="password" placeholder="Enter your password">
          <span id="eye" class="eye">👁</span>
        </div>
      </div>

      <div class="options">
        <label class="remember"><input id="remember" type="checkbox" checked> Keep me logged in</label>
        <a id="forgot" class="forgot" href="#">Forgot Password?</a>
      </div>

      <button id="loginBtn" class="login-btn">↪ Login</button>
      <div id="msg" class="msg"></div>

      <div class="divider">OR CONTINUE WITH</div>

      <button id="googleBtn" class="google-btn"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
<path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.716v2.258h2.909c1.702-1.567 2.684-3.877 2.684-6.615Z"/>
<path fill="#34A853" d="M9 18c2.43 0 4.468-.806 5.956-2.18l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18Z"/>
<path fill="#FBBC05" d="M3.963 10.707A5.41 5.41 0 0 1 3.682 9c0-.592.102-1.168.281-1.707V4.961H.956A9 9 0 0 0 0 9c0 1.45.347 2.824.956 4.039l3.007-2.332Z"/>
<path fill="#EA4335" d="M9 3.579c1.321 0 2.507.454 3.441 1.346l2.581-2.581C13.464.892 11.426 0 9 0A9 9 0 0 0 .956 4.961l3.007 2.332C4.672 5.164 6.656 3.579 9 3.579Z"/>
</svg><span>Sign in with Google</span></button>

      <div class="register">Don't have an account? <a href="register.html">Register here</a></div>
    </section>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup,
  sendPasswordResetEmail, setPersistence, browserLocalPersistence, browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {"apiKey": "AIzaSyCvRetnbUARMXnMQ2UI9ksiFNdpbLIuIMQ", "authDomain": "l2k-top-up-store-lkr.firebaseapp.com", "projectId": "l2k-top-up-store-lkr", "storageBucket": "l2k-top-up-store-lkr.firebasestorage.app", "messagingSenderId": "722986740809", "appId": "1:722986740809:web:bcb97c3d5c2106d4b1a398"};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const emailInput = document.getElementById("email");
const passInput = document.getElementById("password");
const msg = document.getElementById("msg");

function showMsg(text, type="err") {
  msg.className = "msg " + type;
  msg.textContent = text;
}

document.getElementById("eye").onclick = () => {
  passInput.type = passInput.type === "password" ? "text" : "password";
};

async function resolveEmail(value) {
  if(value.includes("@")) return value;
  const q = query(collection(db, "users"), where("username", "==", value));
  const snap = await getDocs(q);
  if(snap.empty) throw new Error("Username not found.");
  return snap.docs[0].data().email;
}

document.getElementById("loginBtn").onclick = async () => {
  const identifier = emailInput.value.trim();
  const password = passInput.value;
  if(!identifier || !password) {
    showMsg("Enter your username/email and password.");
    return;
  }
  try {
    const remember = document.getElementById("remember").checked;
    await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
    const email = await resolveEmail(identifier);
    await signInWithEmailAndPassword(auth, email, password);
    showMsg("Login successful.", "ok");
    setTimeout(() => location.href = "index.html", 800);
  } catch(err) {
    showMsg(err.message);
  }
};

document.getElementById("googleBtn").onclick = async () => {
  try {
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
    showMsg("Google login successful.", "ok");
    setTimeout(() => location.href = "index.html", 800);
  } catch(err) {
    showMsg(err.message);
  }
};

document.getElementById("forgot").onclick = async (e) => {
  e.preventDefault();
  const value = emailInput.value.trim();
  if(!value) {
    showMsg("Enter your email or username first.");
    return;
  }
  try {
    const email = await resolveEmail(value);
    await sendPasswordResetEmail(auth, email);
    showMsg("Password reset email sent.", "ok");
  } catch(err) {
    showMsg(err.message);
  }
};
</script>

<script>
(function(){
  const selectors = [
    '.section','.banner','.card','.dark-card','.product-card','.form-wrap',
    '.contact-box','.faq','.reason-card','.reseller-card','.cta-box','.leaderboard',
    '.app-box','.auth-card','.admin-card','.hero-content','.page-hero .container',
    '.game-center-hero','.games-grid','.profile-head'
  ];
  const nodes = [];
  selectors.forEach(sel=>{
    document.querySelectorAll(sel).forEach(el=>{
      if(!el.classList.contains('l2k-reveal')) {
        el.classList.add('l2k-reveal');
        nodes.push(el);
      }
    });
  });

  document.querySelectorAll('.service-grid,.dark-cards,.product-grid,.games-grid,.reason-grid,.reseller-grid,.podium,.stats')
    .forEach(el=>el.classList.add('l2k-stagger'));

  const reveal = (el)=>el.classList.add('l2k-visible');
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        reveal(entry.target);
        io.unobserve(entry.target);
      }
    });
  },{threshold:.12,rootMargin:'0px 0px -40px 0px'}) : null;

  document.querySelectorAll('.l2k-reveal,.l2k-stagger').forEach(el=>{
    if(io) io.observe(el); else reveal(el);
  });

  // Ripple click effect on interactive controls
  document.querySelectorAll('button,.btn,.small-btn,.google-btn,.login-btn,.submit,.play-btn').forEach(btn=>{
    btn.addEventListener('click',function(e){
      const r=document.createElement('span');
      const rect=this.getBoundingClientRect();
      const size=Math.max(rect.width,rect.height)*1.4;
      r.style.cssText=`position:absolute;width:${size}px;height:${size}px;border-radius:50%;background:rgba(255,255,255,.25);left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px;transform:scale(0);animation:l2kRipple .55s ease-out;pointer-events:none;`;
      const oldPos=getComputedStyle(this).position;
      if(oldPos==='static') this.style.position='relative';
      this.style.overflow='hidden';
      this.appendChild(r);
      setTimeout(()=>r.remove(),600);
    });
  });

  const style=document.createElement('style');
  style.textContent='@keyframes l2kRipple{to{transform:scale(1);opacity:0}}';
  document.head.appendChild(style);
})();
</script>

</body>
</html>
