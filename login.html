<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Login — L2K TOP UP STORE</title>
<link rel="icon" href="logo.svg">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="firebase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;min-height:100vh;background:#f5f8fd;color:#101828}
a{text-decoration:none;color:inherit}
.login-shell{min-height:100vh;display:grid;grid-template-columns:minmax(320px,42%) 1fr;max-width:1180px;margin:auto;background:#fff;box-shadow:0 15px 60px rgba(20,40,80,.08)}
.brand-panel{position:relative;overflow:hidden;background:linear-gradient(160deg,#2167dc 0%,#1764cc 100%);color:#fff;padding:42px 38px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.brand-panel:before{content:"";position:absolute;width:310px;height:310px;border-radius:50%;background:rgba(255,255,255,.06);right:-130px;top:-140px}
.brand-logo{width:100px;height:100px;border-radius:20px;background:#fff;display:grid;place-items:center;margin-bottom:28px;box-shadow:0 13px 30px rgba(0,0,0,.12);z-index:1}
.brand-logo span{width:58px;height:58px;border:3px solid #0b1324;border-radius:50%;display:grid;place-items:center;color:#0b1324;font-family:Poppins;font-weight:900}
.brand-panel h2{font-family:Poppins;font-size:23px;margin-bottom:9px;z-index:1}.brand-panel>p{max-width:300px;font-size:15px;line-height:1.65;z-index:1}
.features{width:100%;max-width:320px;margin-top:40px;background:rgba(255,255,255,.12);border-radius:15px;padding:12px 24px;z-index:1}
.feature{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.18);font-size:13px;font-weight:700;text-align:left}.feature:last-child{border-bottom:0}
.ficon{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.17);display:grid;place-items:center;font-size:19px}
.form-panel{padding:45px 8%;display:flex;justify-content:center;align-items:center}.form-wrap{width:min(520px,100%)}
.form-head{text-align:center;margin-bottom:34px}.form-head h1{font-family:Poppins;font-size:29px;color:#0f172a}.form-head p{margin-top:8px;color:#667085;font-size:14px}
.field{margin-bottom:20px}.field label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;margin-bottom:9px}.input{width:100%;height:56px;border:1px solid #d9e0e8;border-radius:11px;padding:0 16px;font-size:13px;outline:none;background:#fbfcfe}.input:focus{border-color:#2a69e8;box-shadow:0 0 0 3px rgba(42,105,232,.09)}.input::placeholder{color:#a3acbc}
.password-wrap{position:relative}.password-wrap .input{padding-right:46px}.eye{position:absolute;right:13px;top:50%;transform:translateY(-50%);border:0;background:none;color:#98a2b3;font-size:17px;cursor:pointer}
.options{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 27px;font-size:11px;color:#667085}.remember{display:flex;align-items:center;gap:8px}.forgot{color:#1764ea;font-weight:800;cursor:pointer}
.login-btn{width:100%;height:54px;border:0;border-radius:10px;background:linear-gradient(100deg,#2573ef,#1556b8);color:#fff;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 10px 22px rgba(27,91,190,.18)}
.divider{display:flex;align-items:center;gap:16px;margin:28px 0;color:#98a2b3;font-size:10px;font-weight:800}.divider:before,.divider:after{content:"";height:1px;background:#dfe4ec;flex:1}
.google-btn{width:100%;height:54px;border:1px solid #d9e0e8;background:#fff;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}.google-g{font-weight:900;font-size:19px;margin-right:10px;background:conic-gradient(from -45deg,#4285f4 0 25%,#34a853 0 50%,#fbbc05 0 75%,#ea4335 0);-webkit-background-clip:text;background-clip:text;color:transparent}
.register-link{text-align:center;font-size:11px;color:#667085;margin-top:25px}.register-link a{color:#1764ea;font-weight:800}
.back-home{display:inline-block;margin-bottom:25px;color:#64748b;font-size:11px}
.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;font-size:11px;opacity:0;transform:translateY(70px);transition:.25s;z-index:100}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:760px){.login-shell{display:block}.brand-panel{padding:34px 22px}.brand-logo{width:82px;height:82px;margin-bottom:18px}.features{margin-top:24px}.form-panel{padding:35px 20px 45px;align-items:flex-start}}

@media(max-width:760px){
  body{background:#fff}
  .login-shell,.register-shell{display:block;min-height:100vh}
  .brand-panel{padding:28px 18px 24px!important}
  .brand-logo{width:72px!important;height:72px!important;margin-bottom:14px!important}
  .brand-panel h2{font-size:19px!important}
  .brand-panel>p{font-size:11px!important}
  .features{margin-top:18px!important;max-width:100%!important}
  .feature{padding:10px 0!important;font-size:10px!important}
  .form-panel{padding:26px 16px 38px!important;align-items:flex-start!important}
  .form-head{margin-bottom:22px!important}
  .form-head h1{font-size:24px!important}
  .input,select,.google-btn,.login-btn,.submit-btn{min-height:48px}
  .email-row,.phone-row{grid-template-columns:1fr!important}
  .code-btn{height:46px}
}

</style>
</head>
<body>
<div class="login-shell">
  <aside class="brand-panel">
    <div class="brand-logo"><span>L2K</span></div>
    <h2>L2K TOP UP STORE</h2>
    <p>Join thousands of users enjoying fast & secure top-ups</p>
    <div class="features">
      <div class="feature"><span class="ficon">⚡</span><span>Instant Transactions</span></div>
      <div class="feature"><span class="ficon">🔒</span><span>Secure & Protected</span></div>
      <div class="feature"><span class="ficon">◷</span><span>24/7 Support</span></div>
    </div>
  </aside>

  <main class="form-panel">
    <div class="form-wrap">
      <a class="back-home" href="index.html">← Back to Home</a>
      <div class="form-head"><h1>Welcome Back!</h1><p>Log in to continue to L2K TOP UP STORE</p></div>

      <form id="loginForm">
        <div class="field"><label>♙ Username or Email</label><input id="loginEmail" class="input" type="email" required placeholder="Enter your email"></div>
        <div class="field"><label>▢ Password</label><div class="password-wrap"><input id="loginPassword" class="input" type="password" required placeholder="Enter your password"><button type="button" class="eye" onclick="togglePassword()">◉</button></div></div>
        <div class="options"><label class="remember"><input id="remember" type="checkbox" checked> Keep me logged in</label><button type="button" class="forgot" style="border:0;background:none" onclick="forgotPassword()">Forgot Password?</button></div>
        <button class="login-btn" type="submit">↪ &nbsp; Login</button>
      </form>

      <div class="divider">OR CONTINUE WITH</div>
      <button class="google-btn" onclick="googleLogin()"><span class="google-g">G</span> Sign in with Google</button>
      <div class="register-link">Don't have an account? <a href="register.html">Register here</a></div>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script>
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2700)}
function togglePassword(){const p=document.getElementById('loginPassword');p.type=p.type==='password'?'text':'password'}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  try{
    await window.auth.setPersistence(document.getElementById('remember').checked ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
    await window.auth.signInWithEmailAndPassword(email,password);
    toast('Login successful');
    setTimeout(()=>location.href='index.html',800);
  }catch(err){console.error(err);toast(err.message||'Login failed')}
});
async function googleLogin(){
  try{
    if(!window.auth || !window.db) throw new Error('Firebase is not loaded. Check firebase.js and Firebase SDK files.');
    const provider=new firebase.auth.GoogleAuthProvider();
    await window.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const result=await window.auth.signInWithPopup(provider);
    await window.db.ref('users/'+result.user.uid).update({
      username:result.user.displayName||'',
      email:result.user.email||'',
      photoURL:result.user.photoURL||'',
      provider:'google',
      lastLoginAt:firebase.database.ServerValue.TIMESTAMP
    });
    toast('Google login successful');
    setTimeout(()=>location.href='index.html',800);
  }catch(err){console.error(err);toast(err.message||'Google login failed')}
}
async function forgotPassword(){
  const email=document.getElementById('loginEmail').value.trim();
  if(!email){toast('Enter your email first');return}
  try{await window.auth.sendPasswordResetEmail(email);toast('Password reset email sent')}
  catch(err){console.error(err);toast(err.message||'Could not send reset email')}
}
</script>
<script src="animations.js"></script>
</body>
</html>
