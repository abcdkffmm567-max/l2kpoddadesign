<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire SG - L2K CREATIONS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #0d001a; color: #fff; padding-bottom: 80px; }
      .header { background: #1a0033; padding: 15px 5%; border-bottom: 2px solid #8B5CF6; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 99; }
      .header button { background: #8B5CF6; border: none; color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; }
      .section-title { text-align: center; font-size: 18px; font-weight: 700; margin: 20px 0 10px; color: #8B5CF6; }
      
      /* BANNER SLIDER */
      .banner-slider { margin: 10px 5%; border-radius: 15px; overflow: hidden; position: relative; border: 2px solid #8B5CF6; }
      .banner-slider img { width: 100%; height: 180px; object-fit: cover; display: none; }
      .banner-slider img.active { display: block; }
      .banner-dots { position: absolute; bottom: 10px; width: 100%; text-align: center; }
      .dot { display: inline-block; width: 8px; height: 8px; background: #fff; opacity: 0.5; border-radius: 50%; margin: 0 3px; cursor: pointer; }
      .dot.active { opacity: 1; background: #8B5CF6; }

      /* UID VERIFY BOX */
      .uid-box { background: #1a0033; margin: 15px 5%; padding: 20px; border-radius: 15px; border: 2px solid #8B5CF6; text-align: center; }
      .uid-box h3 { color: #8B5CF6; margin-bottom: 15px; font-size: 20px; }
      .uid-box input { width: 100%; padding: 14px; background: #8B5CF6; border: none; color: #fff; border-radius: 10px; font-size: 16px; text-align: center; margin-bottom: 12px; }
      .uid-box input::placeholder { color: #ddd; }
      .btn-check { width: 100%; padding: 14px; background: linear-gradient(90deg, #00C853, #00E676); border: none; color: #fff; border-radius: 50px; font-weight: 700; font-size: 16px; cursor: pointer; }
      .uid-info { color: #00E676; font-size: 12px; margin-top: 10px; line-height: 1.6; }
      
      /* VERIFIED BOX - SIMPLE */
      .player-verified { display: none; background: #0d001a; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid #00E676; text-align: center; }
      .player-verified .verified-badge { color: #00E676; font-weight: 700; font-size: 15px; }
      .player-verified p { margin: 5px 0; }

      .diamond-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 5%; }
      .diamond-card { background: #1a0033; border: 1px solid #8B5CF6; border-radius: 15px; padding: 12px; text-align: center; }
      .diamond-card img { width: 50px; height: 50px; margin-bottom: 8px; object-fit: contain; }
      .diamond-card h4 { font-size: 12px; margin-bottom: 8px; min-height: 30px; }
      .price-btn { width: 100%; background: linear-gradient(90deg, #8B5CF6, #A855F7); border: none; color: #FFD700; padding: 8px; border-radius: 10px; font-weight: 700; margin-bottom: 8px; font-size: 14px; }
      .qty-box { display: flex; border: 1px solid #8B5CF6; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
      .qty-box button { background: #8B5CF6; border: none; color: #fff; width: 35px; cursor: pointer; font-size: 16px; }
      .qty-box input { width: 100%; text-align: center; background: #0d001a; border: none; color: #fff; }
      .add-btn { width: 100%; background: #333; border: 1px solid #8B5CF6; color: #fff; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 600; }
      .add-btn:hover { background: #8B5CF6; }

      .admin-panel { display: none; background: #1a0033; margin: 15px 5%; padding: 15px; border-radius: 15px; border: 2px solid #8B5CF6; }
      .admin-panel h3 { color: #8B5CF6; margin-bottom: 10px; }
      .diamond-edit-item { background: #0d001a; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
      .diamond-edit-item p { font-size: 12px; margin-bottom: 5px; }
      .diamond-edit-item input { width: 100%; padding: 8px; margin: 5px 0; background: #1a0033; border: 1px solid #8B5CF6; color: #fff; border-radius: 8px; font-size: 12px; }
      .btn-save-all { width: 100%; background: linear-gradient(90deg, #8B5CF6, #A855F7); color: #fff; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 10px; }
      .banner-edit-item { background: #0d001a; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px dashed #8B5CF6; }
    </style>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

    <header class="header">
        <button onclick="history.back()">❮ Back</button>
        <h2>Free Fire SG</h2>
        <button id="adminBtnFF" onclick="toggleAdminFF()" style="display:none;margin-left:auto;background:red;">Admin</button>
    </header>

    <!-- BANNER SLIDER -->
    <div class="banner-slider" id="bannerSlider"></div>

    <!-- UID VERIFY SECTION -->
    <div class="uid-box">
        <h3>Enter the User ID</h3>
        <input type="number" id="uidInput" placeholder="Enter User ID">
        <button class="btn-check" onclick="checkUID()">Check Username</button>
        
        <div class="player-verified" id="playerVerified">
            <p class="verified-badge">✓ Verified - SG Region</p>
            <p style="font-size:12px">UID: <span id="playerUID"></span></p>
        </div>
        
        <p class="uid-info">නිවැරදි Singapore Region UID එක ඇතුලත් කරන්න. <br>Game Name හෝ Success ලෙස පෙන්වන්නේ නම් ඔබට TOPUP කළ හැකිය</p>
    </div>

    <!-- ADMIN PANEL -->
    <div class="admin-panel" id="adminPanelFF">
        <h3>⚙️ Edit Banner Images</h3>
        <div id="banner-edit-list"></div>
        <button class="btn-save-all" onclick="saveBanners()">💾 Save Banners</button>

        <h3 style="margin-top:20px">⚙️ Edit Diamond Packs</h3>
        <div id="diamond-edit-list"></div>
        <button class="btn-save-all" onclick="saveAllToFirebase()">💾 Save Packs</button>
    </div>

    <h3 class="section-title">Membership</h3>
    <div class="diamond-grid" id="membership-grid"></div>

    <h3 class="section-title">Diamond Top Up</h3>
    <div class="diamond-grid" id="diamond-grid"></div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
          apiKey: "AIzaSyC2qIi0iDiDRD8IbYU0poKOqMeB59TijC8",
          authDomain: "l2ktopupstore-b19ca.firebaseapp.com",
          databaseURL: "https://l2ktopupstore-b19ca-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "l2ktopupstore-b19ca",
          storageBucket: "l2ktopupstore-b19ca.firebasestorage.app",
          messagingSenderId: "705954048401",
          appId: "1:705954048401:web:a4edbb11e41cc64ee69230"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let defaultBanners = [
            {img: 'https://via.placeholder.com/600x200/8B5CF6/fff?text=L2K+FF+TOPUP', link: '#'},
            {img: 'https://via.placeholder.com/600x200/A855F7/fff?text=100%25+Trusted+Store', link: '#'}
        ];
        
        // ===== FULL PRICE LIST =====
        let defaultDiamonds = [
            // MEMBERSHIP
            {id: 'wklite', name: 'WEEKLY LITE', price: 130, img: 'https://via.placeholder.com/50/8B5CF6/fff?text=W', type: 'membership'},
            {id: 'wk', name: 'WEEKLY', price: 550, img: 'https://via.placeholder.com/50/A855F7/fff?text=W', type: 'membership'},
            {id: 'month', name: 'MONTHLY', price: 2750, img: 'https://via.placeholder.com/50/FFD700/000?text=M', type: 'membership'},
            {id: 'vip', name: 'VIP MEMBERSHIP', price: 3300, img: 'https://via.placeholder.com/50/8B5CF6/fff?text=VIP', type: 'membership'},
            {id: 'svip', name: 'SVIP MEMBERSHIP', price: 4950, img: 'https://via.placeholder.com/50/A855F7/fff?text=SVIP', type: 'membership'},
            
            // DIAMONDS
            {id: 'd25', name: 'Diamond x 25', price: 85, img: 'https://via.placeholder.com/50/00BFFF/000?text=💎', type: 'diamond'},
            {id: 'd50', name: 'Diamond x 50', price: 170, img: 'https://via.placeholder.com/50/00BFFF/000?text=💎', type: 'diamond'},
            {id: 'd100', name: 'Diamond x 100', price: 310, img: 'https://via.placeholder.com/50/00BFFF/000?text=💎', type: 'diamond'},
            {id: 'd200', name: 'Diamond x 200', price: 620, img: 'https://via.placeholder.com/50/00BFFF/000?text=💎', type: 'diamond'},
            {id: 'd310', name: 'Diamond x 310', price: 930, img: 'https://via.placeholder.com/50/00BFFF/000?text=💎', type: 'diamond'},
            {id: 'd520', name: 'Diamond x 520', price: 1560, img: 'https://via.placeholder.com/50/00BFFF/000?text=💎', type: 'diamond'},
            {id: 'd1060', name: 'Diamond x 1060', price: 3100, img: 'https://via.placeholder.com/50/00BFFF/000?text=💎', type: 'diamond'},
            {id: 'd1580', name: 'Diamond x 1580', price: 4660, img: 'https://via.placeholder.com/50/00BFFF/000?text=💎', type: 'diamond'},
            {id: 'd2180', name: 'Diamond x 2180', price: 6190, img: 'https://via.placeholder.com/50/00BFFF/000?text=💎', type: 'diamond'},
            {id: 'd3240', name: 'Diamond x 3240', price: 9290, img: 'https://via.placeholder.com/50/00BFFF/000?text=💎', type: 'diamond'},
            {id: 'd4360', name: 'Diamond x 4360', price: 12380, img: 'https://via.placeholder.com/50/00BFFF/000?text=💎', type: 'diamond'},
            {id: 'd5600', name: 'Diamond x 5600', price: 14500, img: 'https://via.placeholder.com/50/00BFFF/000?text=💎', type: 'diamond'},
            {id: 'd10060', name: 'Diamond x 10060', price: 27190, img: 'https://via.placeholder.com/50/00BFFF/000?text=💎', type: 'diamond'},
            {id: 'd11500', name: 'Diamond x 11500', price: 29900, img: 'https://via.placeholder.com/50/00BFFF/000?text=💎', type: 'diamond'}
        ];

        let banners = [];
        let diamonds = [];
        let currentUser = JSON.parse(localStorage.getItem("currentUser"));
        let verifiedPlayer = null;
        let bannerIndex = 0;

        function init(){
            if(currentUser && currentUser.role == 'admin'){ 
                document.getElementById('adminBtnFF').style.display = 'block'; 
            }
            loadAllFromFirebase();
        }

        function loadAllFromFirebase(){
            db.ref("ffsg_banners").on("value", snap => {
                banners = snap.val() || defaultBanners;
                loadBanners();
                loadBannerAdmin();
            });
            db.ref("ffsg_diamonds").on("value", snap => {
                diamonds = snap.val() || defaultDiamonds;
                loadDiamonds();
                loadAdminEdit();
            });
        }

        // ===== BANNER SLIDER =====
        function loadBanners(){
            let slider = document.getElementById('bannerSlider');
            slider.innerHTML = '';
            banners.forEach((b, i)=>{
                slider.innerHTML += `<a href="${b.link}"><img src="${b.img}" class="${i==0?'active':''}" onerror="this.src='https://via.placeholder.com/600x200/ff0000/fff'"></a>`;
            });
            slider.innerHTML += `<div class="banner-dots">${banners.map((_,i)=>`<span class="dot ${i==0?'active':''}" onclick="showBanner(${i})"></span>`).join('')}</div>`;
            autoSlide();
        }
        function showBanner(i){
            document.querySelectorAll('.banner-slider img').forEach((img, idx)=> img.classList.toggle('active', idx==i));
            document.querySelectorAll('.dot').forEach((dot, idx)=> dot.classList.toggle('active', idx==i));
            bannerIndex = i;
        }
        function autoSlide(){
            setInterval(()=>{
                bannerIndex = (bannerIndex + 1) % banners.length;
                showBanner(bannerIndex);
            }, 4000);
        }

        // ===== UID CHECK =====
        function checkUID(){
            let uid = document.getElementById('uidInput').value;
            if(uid.length < 8){
                alert("❌ Invalid UID \nSingapore Region UID එක 8-9 digits වෙන්න ඕනේ");
                document.getElementById('playerVerified').style.display = 'none';
                verifiedPlayer = null;
                return;
            }
            verifiedPlayer = {name: "Verified User", uid: uid};
            document.getElementById('playerUID').innerText = uid;
            document.getElementById('playerVerified').style.display = 'block';
        }

        // ===== DIAMONDS =====
        function loadDiamonds(){
            let memGrid = document.getElementById('membership-grid');
            let diaGrid = document.getElementById('diamond-grid');
            memGrid.innerHTML = ''; diaGrid.innerHTML = '';
            diamonds.forEach(item=>{
                let card = `<div class="diamond-card"><img src="${item.img}"><h4>${item.name}</h4><button class="price-btn">LKR ${item.price.toLocaleString()}</button><div class="qty-box"><button onclick="changeQty('${item.id}', -1)">-</button><input type="number" id="qty-${item.id}" value="0" readonly><button onclick="changeQty('${item.id}', 1)">+</button></div><button class="add-btn" onclick="buy('${item.name}', ${item.price})">Add</button></div>`;
                if(item.type == 'membership') memGrid.innerHTML += card; else diaGrid.innerHTML += card;
            });
        }

        // ===== ADMIN =====
        function loadBannerAdmin(){
            let list = document.getElementById('banner-edit-list');
            list.innerHTML = '';
            banners.forEach((b,i)=>{
                list.innerHTML += `<div class="banner-edit-item"><p><b>Banner ${i+1}</b></p><input type="text" placeholder="Image Direct Link" id="banner-img-${i}" value="${b.img}"><input type="text" placeholder="Click Link URL" id="banner-link-${i}" value="${b.link}"></div>`;
            });
        }
        function saveBanners(){
            banners.forEach((b,i)=>{
                b.img = document.getElementById(`banner-img-${i}`).value;
                b.link = document.getElementById(`banner-link-${i}`).value;
            });
            db.ref("ffsg_banners").set(banners);
            alert("✅ Banners Saved!");
        }
        function loadAdminEdit(){
            let list = document.getElementById('diamond-edit-list');
            list.innerHTML = '';
            diamonds.forEach(item=>{
                list.innerHTML += `<div class="diamond-edit-item"><p><b>${item.name}</b></p><input type="number" placeholder="New Price LKR" id="price-${item.id}" value="${item.price}"><input type="text" placeholder="Image Direct Link" id="imglink-${item.id}" value="${item.img}"></div>`;
            });
        }
        function saveAllToFirebase(){
            diamonds.forEach(item=>{
                item.price = parseInt(document.getElementById(`price-${item.id}`).value) || item.price;
                item.img = document.getElementById(`imglink-${item.id}`).value || item.img;
            });
            db.ref("ffsg_diamonds").set(diamonds);
            alert("✅ Packs Saved!");
        }

        function changeQty(id, n){
            let input = document.getElementById(`qty-${id}`);
            let val = parseInt(input.value) + n;
            if(val >= 0) input.value = val;
        }
        function buy(name, price){
            if(!verifiedPlayer) return alert("පලවෙනි UID එක Verify කරන්න!");
            if(!currentUser) return alert("Please Login first!");
            let msg = `🔥 NEW FF ORDER 🔥\n\nUID: ${verifiedPlayer.uid}\nItem: ${name} - LKR ${price}\nUser: ${currentUser.user}`;
            window.open(`https://wa.me/94740682507?text=${encodeURIComponent(msg)}`, '_blank');
        }
        function toggleAdminFF(){
            document.getElementById('adminPanelFF').style.display = document.getElementById('adminPanelFF').style.display=='block'?'none':'block';
        }
        init();
    </script>
</body>
</html>
