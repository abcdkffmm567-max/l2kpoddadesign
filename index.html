<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L2K TOP UP STORE | Free Fire Diamond Top Up</title>
<meta name="description" content="L2K TOP UP STORE - Fast, Safe and Trusted Free Fire Diamond Top Up Store.">
<link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app"></div>
<script>
(function(){
const products=[25,50,100,310,520,1060,2180,5600].map((amount,i)=>({amount,price:[80,150,290,650,950,1800,3400,8200][i]}));
const memberships=[{name:'Weekly Membership',price:450,description:'7-day Free Fire membership'},{name:'Monthly Membership',price:1250,description:'30-day Free Fire membership'}];
const app=document.getElementById('app'); const money=n=>'LKR '+Number(n).toLocaleString();
function nav(){return '<header class="nav"><div class="navin"><a class="brand" href="#/"><img src="assets/logo.svg">L2K TOP UP STORE</a><button class="menu" id="menu">☰</button><nav class="navlinks" id="links"><a href="#/">Home</a><a href="#/diamonds">Diamond Top Up</a><a href="#/membership">Membership</a><a href="#/how-to-order">How To Order</a><a href="#/orders">My Orders</a><a href="#/contact">Contact</a><a href="#/admin/login">Admin Login</a></nav></div></header>'}
function layout(x){return nav()+'<main class="container">'+x+'</main><footer class="footer">© 2026 L2K TOP UP STORE • Fast • Safe • Trusted</footer>'}
function home(){return layout('<section class="hero"><div class="orb one"></div><div class="orb two"></div><div><div class="muted">PREMIUM GAMING TOP-UP PLATFORM</div><h1>L2K TOP UP STORE</h1><p>FAST • SAFE • TRUSTED FREE FIRE TOP UP</p><div class="actions"><a class="btn" href="#/diamonds">💎 Top Up Now</a><a class="btn alt" href="#/diamonds">View Prices</a></div></div></section><section><div class="sectionhead"><h2>Why Choose L2K TOP UP STORE?</h2></div><div class="grid5">'+[['⚡','Fast Delivery'],['🔒','Safe & Secure'],['💎','Best Prices'],['🤝','Trusted Service'],['📱','24/7 Support']].map(x=>'<div class="card"><div class="icon">'+x[0]+'</div><h3>'+x[1]+'</h3><p class="muted">Professional service for every order.</p></div>').join('')+'</div></section>')}
function diamonds(){return layout('<section><div class="sectionhead"><h2>💎 Free Fire Diamond Top Up</h2><p class="muted">Select your package.</p></div><div class="products">'+products.map((p,i)=>'<div class="card product"><div class="diamond">💎</div><h3>'+p.amount+' Diamonds</h3><div class="price">'+money(p.price)+'</div><button class="btn" onclick="order('+i+',\'diamond\')">BUY NOW</button></div>').join('')+'</div></section>')}
function membership(){return layout('<section><div class="sectionhead"><h2>👑 Membership</h2></div><div class="grid">'+memberships.map((m,i)=>'<div class="card"><div class="icon">👑</div><h3>'+m.name+'</h3><p class="muted">'+m.description+'</p><div class="price">'+money(m.price)+'</div><button class="btn" onclick="order('+i+',\'membership\')">BUY NOW</button></div>').join('')+'</div></section>')}
window.order=function(i,t){let p=t==='diamond'?products[i]:memberships[i],name=t==='diamond'?p.amount+' Diamonds':p.name;app.innerHTML=layout('<section><div class="form"><h2>Place Order</h2><div class="card"><form onsubmit="submitOrder(event)">'+(t==='diamond'?'<div class="field"><label>Free Fire Player ID</label><input name="player" required></div>':'')+'<div class="field"><label>Package</label><input value="'+name+'" disabled></div><div class="field"><label>Price</label><input value="'+money(p.price)+'" disabled></div><div class="field"><label>Customer Name</label><input name="customer" required></div><div class="field"><label>WhatsApp Number</label><input name="phone" required></div><div class="field"><label>Payment Method</label><select name="method"><option>Bank Transfer</option><option>eZ Cash</option><option>mCash</option><option>Other</option></select></div><div class="field"><label>Payment Reference</label><input name="ref" required></div><div class="field"><label>Optional Note</label><textarea name="note"></textarea></div><button class="btn">Place Order</button></form></div></div></section>');window.scrollTo(0,0)};
window.submitOrder=function(e){e.preventDefault();let id='L2K-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,8).toUpperCase();app.innerHTML=layout('<section><div class="form"><div class="card" style="text-align:center"><div class="icon">✅</div><h2>Order Successfully Placed!</h2><p>Your Order ID</p><h2>'+id+'</h2><p class="muted">Preview mode: connect Supabase for real database orders.</p><a class="btn" href="#/orders">Track My Order</a></div></div></section>')};
function orders(){return layout('<section><div class="form"><h2>🔎 My Orders</h2><div class="card"><p class="muted">Enter your Order ID and WhatsApp number after Supabase is connected.</p><div class="field"><label>Order ID</label><input placeholder="L2K-2026-XXXXXX"></div><div class="field"><label>WhatsApp Number</label><input placeholder="07XXXXXXXX"></div><button class="btn" onclick="alert(\'Supabase tracking will be enabled after connection.\')">Check Status</button></div></div></section>')}
function how(){return layout('<section><div class="sectionhead"><h2>How To Order</h2></div><div class="grid">'+['Select your Diamond package','Enter your Free Fire Player ID','Select payment method','Make the payment','Enter payment reference','Submit your order','Wait for confirmation','Diamonds will be delivered'].map((x,i)=>'<div class="card"><div class="icon">'+(i+1)+'</div><h3>'+x+'</h3></div>').join('')+'</div></section>')}
function contact(){return layout('<section><div class="sectionhead"><h2>Need Help?</h2><p class="muted">Contact L2K TOP UP STORE Support</p></div><div class="grid"><div class="card"><div class="icon">💬</div><h3>WhatsApp</h3><p class="muted">Support link can be added from Admin Settings.</p></div><div class="card"><div class="icon">📘</div><h3>Facebook</h3></div><div class="card"><div class="icon">✈️</div><h3>Telegram</h3></div></div></section>')}
function admin(){return layout('<section><div class="form"><h2>🔐 Admin Login</h2><div class="card"><p class="muted">Supabase authentication will be used here in the live version.</p><div class="field"><label>Email</label><input type="email"></div><div class="field"><label>Password</label><input type="password"></div><button class="btn" onclick="alert(\'Connect Supabase to enable secure admin login.\')">Login Securely</button></div></div></section>')}
function route(){let p=location.hash.slice(1)||'/';let out=p==='/'?home():p==='/diamonds'?diamonds():p==='/membership'?membership():p==='/how-to-order'?how():p==='/orders'?orders():p==='/contact'?contact():p==='/admin/login'?admin():home();app.innerHTML=out;let m=document.getElementById('menu');if(m)m.onclick=()=>document.getElementById('links').classList.toggle('open');window.scrollTo(0,0)}
window.addEventListener('hashchange',route);document.addEventListener('DOMContentLoaded',()=>{let l=document.createElement('div');l.className='loader';l.innerHTML='<div class="loadbox"><img src="assets/logo.svg" width="70"><h2>L2K TOP UP STORE</h2><div class="spinner"></div><p class="muted">Loading store...</p></div>';document.body.appendChild(l);route();setTimeout(()=>l.classList.add('hide'),450)})
})();
</script></body></html>
