<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2K CREATIONS TOP UP STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #0d001a; color: #fff; }

      .header { background: #1a0033; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #8B5CF6; position: sticky; top: 0; z-index: 100; }
      .logo-area { display: flex; align-items: center; gap: 12px; }
      .logo-area img { width: 50px; height: 50px; border-radius: 10px; border: 2px solid #8B5CF6; object-fit: cover; }
      .logo-text small { color: #aaa; font-size: 12px; }
      .logo-text h2 { font-size: 16px; font-weight: 800; color: #fff; }
      .btn-group { display: flex; gap: 10px; }
      .btn-login { background: linear-gradient(90deg, #8B5CF6, #A855F7); padding: 10px 20px; border-radius: 50px; color: #fff; font-weight: 600; border: none; cursor: pointer; font-size: 13px; }
      .btn-admin { background: red; padding: 10px 15px; border-radius: 50px; color: #fff; font-weight: 600; border: none; cursor: pointer; font-size: 13px; }

      .banner-slider { position: relative; margin: 15px 5%; border-radius: 15px; overflow: hidden; min-height: 180px; background: #1a0033; }
      .banner-slide { display: none; position: relative; }
      .banner-slide.active { display: block; }
      .banner-slider img { width: 100%; border-radius: 15px; display: block; }
      .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 8px 12px; cursor: pointer; font-size: 18px; border-radius: 50%; }
      .slider-btn.prev { left: 10px; }
      .slider-btn.next { right: 10px; }
      .delete-btn { position: absolute; top: 10px; right: 10px; background: red; border: none; color: #fff; padding: 5px 10px; border-radius: 5px; cursor: pointer; z-index: 10; font-size: 12px; }

      .section-title { text-align: center; font-size: 20px; font-weight: 700; margin: 25px 0 15px; }

      .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 5% 50px; }
      .game-card { background: #1a0033; border: 1px solid #8B5CF6; border-radius: 15px; padding: 12px; text-align: center; position: relative; opacity: 1; transition: 0.3s; }
      .game-card.locked { opacity: 0.4; }
      .game-card h3 { font-size: 13px; font-weight: 700; margin-bottom: 8px; min-height: 35px; }
      .game-card img { width: 70px; height: 70px; border-radius: 10px; margin-bottom: 8px; object-fit: cover; background: #000; }
      .btn-topup { width: 100%; background: linear-gradient(90deg, #8B5CF6, #A855F7); border: none; color: #fff; padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; }
      .btn-topup:disabled { background: #555; cursor: not-allowed; }
      .lock-badge { position: absolute; top: 5px; left: 5px; background: red; color: #fff; padding: 3px 8px; border-radius: 5px; font-size: 10px; font-weight: 700; display: none; }
      .game-card.locked.lock-badge { display: block; }

      .admin-panel { display: none; background: #1a0033; margin: 20px 5%; padding: 20px; border-radius: 15px; border: 2px solid #8B5CF6; }
      .admin-panel h4 { color: #8B5CF6; margin: 15px 0 8px; }
      .admin-panel input { width: 100%; padding: 10px; margin: 8px 0; background: #0d001a; border: 1px solid #8B5CF6; color: #fff; border-radius: 8px; }
      .game-toggle { display: flex; justify-content: space-between; align-items: center; background: #0d001a; padding: 10px; margin: 8px 0; border-radius: 8px; }
      .toggle-switch { width: 50px; height: 25px; background: #555; border-radius: 50px; position: relative; cursor: pointer; }
      .toggle-switch.active { background: #8B5CF6; }
      .toggle-switch::after { content: ''; position: absolute; width: 21px; height: 21px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: 0.3s; }
      .toggle-switch.active::after { left: 27px; }

      .footer { background: #1a0033; padding: 30px 5%; text-align: center; border-top: 2px solid #8B5CF6; }
      .social-icons { display: flex; justify-content: center; gap: 15px; margin: 15px 0; flex-wrap: wrap; }
      .social-icons img { width: 35px; height: 35px; cursor: pointer; }
      .btn-terms { background: transparent; border: 1px solid #8B5CF6; color: #fff; padding: 10px 25px; border-radius: 50px; margin: 15px 0; cursor: pointer; }
      .payment-icons { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
      .payment-icons img { height: 30px; background: #fff; padding: 3px; border-radius: 5px; }
      .copyright { color: #aaa; font-size: 12px; margin-top: 15px; }

      .login-popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; }
      .login-box { background: #1a0033; padding: 30px; border-radius: 20px; border: 2px solid #8B5CF6; width: 90%; max-width: 400px; }
      .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #0d001a; border: 1px solid #8B5CF6; color: #fff; border-radius: 8px; }
      .tab-btn { display: flex; gap: 10px; margin-bottom: 15px; }
      .tab-btn button { flex: 1; padding: 10px; background: #0d001a; border: 1px solid #8B5CF6; color: #fff; border-radius: 8px; cursor: pointer; }
      .tab-btn button.active { background: #8B5CF6; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-area">
            <img id="siteLogo" src="https://via.placeholder.com/50/8B5CF6/fff?text=L2K" alt="Logo">
            <div class="logo-text">
                <small>welcome to</small>
                <h2>L2K CREATIONS TOP UP STORE</h2>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-login" id="userBtn" onclick="showUserLogin()">Register or Login</button>
            <button class="btn-admin" id="adminLoginBtn" onclick="showAdminLogin()">Admin</button>
            <button class="btn-login" id="adminBtn" onclick="toggleAdmin()" style="display:none;">Panel</button>
            <button class="btn-login" id="logoutBtn" onclick="logout()" style="display:none;background:red;">Logout</button>
        </div>
    </header>

    <!-- ADMIN PANEL -->
    <div class="admin-panel" id="adminPanel">
        <h3 style="color:#8B5CF6;margin-bottom:10px;">⚙️ Admin Panel</h3>

        <h4>1. Change Logo</h4>
        <input type="file" id="logo-upload" accept="image/*">
        <button class="btn-topup" onclick="uploadLogo()">Upload Logo</button>

        <h4>2. Add Banner</h4>
        <input type="file" id="banner-img" accept="image/*">
        <input type="text" id="banner-link" placeholder="Banner Link URL">
        <button class="btn-topup" onclick="addBanner()">Upload Banner</button>

        <h4>3. Enable / Lock Games</h4>
        <div id="game-toggle-list"></div>

        <h4>4. Edit Game Images</h4>
        <div id="game-edit-list"></div>
    </div>

    <div class="banner-slider" id="bannerSlider"></div>
    <h2 class="section-title">Select your Game to Top up</h2>
    <div class="games-grid" id="gamesGrid"></div>

    <footer class="footer">
        <p>Contact us</p>
        <div class="social-icons">
            <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
            <img src="https://cdn-icons-png.flaticon.com/512/1384/1384053.png">
            <img src="https://cdn-icons-png.flaticon.com/512/1384/1384065.png" onclick="window.open('https://wa.me/94740682507')">
        </div>
        <button class="btn-terms">Terms and Conditions</button>
        <p style="font-size:12px;color:#aaa;">PAY WITH</p>
        <div class="payment-icons">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg">
            <img src="https://via.placeholder.com/60x30?text=LankaQR">
        </div>
        <p class="copyright">©2026 L2K CREATIONS. All rights reserved.</p>
    </footer>

    <!-- USER + ADMIN LOGIN POPUP -->
    <div class="login-popup" id="loginPopup">
        <div class="login-box">
            <h3 style="color:#8B5CF6;text-align:center;margin-bottom:15px;" id="popupTitle">🔐 Login</h3>
            <div class="tab-btn" id="userTabs">
                <button id="loginTab" class="active" onclick="switchTab('login')">Login</button>
                <button id="registerTab" onclick="switchTab('register')">Register</button>
            </div>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <input type="text" id="phone" placeholder="Phone Number" style="display:none;">
            <button class="btn-topup" id="submitBtn" onclick="loginUser()">Login</button>
            <p style="text-align:center;margin-top:10px;cursor:pointer;" onclick="hideLogin()">Close</p>
        </div>
    </div>

    <script>
        let defaultGames = [
            {id: 'ffsg', name: 'Free Fire SG', img: 'https://via.placeholder.com/70/FF0000/fff?text=FF', enabled: true},
            {id: 'fflup', name: 'Free Fire - Level Up Pass', img: 'https://via.placeholder.com/70/A855F7/fff?text=LUP', enabled: true},
            {id: 'ffid', name: 'Free Fire Indonesia', img: 'https://via.placeholder.com/70/FF0000/fff?text=FFID', enabled: false},
            {id: 'bs', name: 'Blood Strike', img: 'https://via.placeholder.com/70/00FF00/000?text=BS', enabled: false},
            {id: 'ml', name: 'Mobile Legends', img: 'https://via.placeholder.com/70/0066FF/fff?text=ML', enabled: false},
            {id: 'pubg', name: 'PUBG Mobile', img: 'https://via.placeholder.com/70/FFA500/000?text=PUBG', enabled: false},
            {id: 'farlight', name: 'Farlight 84', img: 'https://via.placeholder.com/70/8B5CF6/fff?text=F84', enabled: false},
            {id: 'valo', name: 'Valorant (Singapore)', img: 'https://via.placeholder.com/70/FF4655/fff?text=V', enabled: false}
        ];

        let games = JSON.parse(localStorage.getItem("games")) || defaultGames;
        let banners = JSON.parse(localStorage.getItem("banners")) || [{img: "https://via.placeholder.com/1200x400/8B5CF6/fff?text=L2K+TOP+UP+100%25+TRUSTED", link: "#"}];
        let users = JSON.parse(localStorage.getItem("users")) || [];
        let currentUser = JSON.parse(localStorage.getItem("currentUser"));
        let slideIndex = 0;
        let loginType = 'user';

        function showUI(){
            if(currentUser){
                document.getElementById('userBtn').style.display = 'none';
                document.getElementById('adminLoginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'inline-block';
                if(currentUser.role == 'admin'){
                    document.getElementById('adminBtn').style.display = 'inline-block';
                }
            }
            loadLogo();
            loadBanners();
            loadGames();
            loadGameToggle();
            loadGameEditForm();
        }

        // LOGO UPLOAD FUNCTION
        function loadLogo(){
            let savedLogo = localStorage.getItem("site_logo");
            if(savedLogo){
                document.getElementById('siteLogo').src = savedLogo;
            }
        }
        function uploadLogo(){
            let file = document.getElementById('logo-upload').files[0];
            if(!file) return alert("Logo image එකක් select කරන්න");
            let reader = new FileReader();
            reader.onload = function(e){
                localStorage.setItem("site_logo", e.target.result);
                document.getElementById('siteLogo').src = e.target.result;
                alert("✅ Logo Updated Successfully");
            }
            reader.readAsDataURL(file);
        }

        // USER REGISTER + LOGIN SYSTEM
        function showUserLogin(){
            loginType = 'user';
            document.getElementById('popupTitle').innerText = '👤 User Login';
            document.getElementById('userTabs').style.display = 'flex';
            document.getElementById('phone').style.display = 'none';
            document.getElementById('submitBtn').innerText = 'Login';
            document.getElementById('loginPopup').style.display = 'flex';
        }
        function showAdminLogin(){
            loginType = 'admin';
            document.getElementById('popupTitle').innerText = '🔑 Admin Login';
            document.getElementById('userTabs').style.display = 'none';
            document.getElementById('phone').style.display = 'none';
            document.getElementById('submitBtn').innerText = 'Admin Login';
            document.getElementById('loginPopup').style.display = 'flex';
        }
        function switchTab(tab){
            if(tab == 'login'){
                document.getElementById('loginTab').classList.add('active');
                document.getElementById('registerTab').classList.remove('active');
                document.getElementById('phone').style.display = 'none';
                document.getElementById('submitBtn').innerText = 'Login';
            } else {
                document.getElementById('registerTab').classList.add('active');
                document.getElementById('loginTab').classList.remove('active');
                document.getElementById('phone').style.display = 'block';
                document.getElementById('submitBtn').innerText = 'Register';
            }
        }
        function loginUser(){
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;
            let phone = document.getElementById('phone').value;

            if(loginType == 'admin'){
                if(u=='admin' && p=='l2k123'){
                    currentUser = {user: 'admin', role: 'admin'};
                    localStorage.setItem("currentUser", JSON.stringify(currentUser));
                    location.reload();
                } else alert("Wrong Admin Username or Password");
                return;
            }

            if(document.getElementById('submitBtn').innerText == 'Register'){
                if(!u ||!p ||!phone) return alert("All fields required");
                if(users.find(x=>x.user==u)) return alert("Username already exists");
                users.push({user: u, pass: p, phone: phone});
                localStorage.setItem("users", JSON.stringify(users));
                alert("✅ Registration Successful! Now Login");
                switchTab('login');
            } else {
                let user = users.find(x=>x.user==u && x.pass==p);
                if(user){
                    currentUser = {user: u, role: 'user'};
                    localStorage.setItem("currentUser", JSON.stringify(currentUser));
                    location.reload();
                } else alert("Wrong Username or Password");
            }
        }
        function logout(){ localStorage.removeItem("currentUser"); location.reload(); }
        function hideLogin(){ document.getElementById('loginPopup').style.display = 'none'; }

        // GAMES + ADMIN FUNCTIONS
        function loadGames(){
            let grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            games.forEach(game=>{
                grid.innerHTML += `
                <div class="game-card ${game.enabled? '' : 'locked'}">
                    <span class="lock-badge">🔒 LOCKED</span>
                    <h3>${game.name}</h3>
                    <img src="${game.img}" id="img-${game.id}">
                    <button class="btn-topup" onclick="topUp('${game.name}', ${game.enabled}, '${game.id}')" ${game.enabled? '' : 'disabled'}>
                        ${game.enabled? 'Top Up' : 'Coming Soon'}
                    </button>
                </div>`;
            });
        }
        function loadGameToggle(){
            let list = document.getElementById('game-toggle-list');
            list.innerHTML = '';
            games.forEach(game=>{
                list.innerHTML += `<div class="game-toggle"><span>${game.name}</span><div class="toggle-switch ${game.enabled? 'active' : ''}" onclick="toggleGame('${game.id}')"></div></div>`;
            });
        }
        function toggleGame(id){
            let game = games.find(g=>g.id==id); game.enabled =!game.enabled;
            localStorage.setItem("games", JSON.stringify(games)); loadGames(); loadGameToggle();
        }
        function loadGameEditForm(){
            let list = document.getElementById('game-edit-list');
            list.innerHTML = '';
            games.forEach(game=>{
                list.innerHTML += `<div style="background:#0d001a;padding:10px;border-radius:8px;margin-bottom:10px;"><p><b>${game.name}</b></p><input type="file" accept="image/*" onchange="uploadGameImage('${game.id}', this)"></div>`;
            });
        }
        function uploadGameImage(id, input){
            let file = input.files[0]; if(!file) return;
            let reader = new FileReader();
            reader.onload = function(e){
                let game = games.find(g=>g.id==id); game.img = e.target.result;
                localStorage.setItem("games", JSON.stringify(games));
                document.getElementById(`img-${id}`).src = e.target.result; alert(`✅ ${game.name} Image Updated`);
            }
            reader.readAsDataURL(file);
        }
        function loadBanners(){
            let slider = document.getElementById('bannerSlider');
            let slidesHTML = '';
            banners.forEach((b, i)=>{ slidesHTML += `<div class="banner-slide ${i==0?'active':''}"><a href="${b.link}" target="_blank"><img src="${b.img}"></a><button class="delete-btn" onclick="deleteBanner(${i})" style="display:${currentUser?.role=='admin'?'block':'none'}">Delete</button></div>`; });
            slider.innerHTML = `<button class="slider-btn prev" onclick="changeSlide(-1)">❮</button>${slidesHTML}<button class="slider-btn next" onclick="changeSlide(1)">❯</button>`;
            setInterval(()=>changeSlide(1), 4000);
        }
        function changeSlide(n){ let slides = document.querySelectorAll('.banner-slide'); if(slides.length==0) return; slides[slideIndex].classList.remove('active'); slideIndex = (slideIndex + n + slides.length) % slides.length; slides[slideIndex].classList.add('active'); }
        function addBanner(){
            let file = document.getElementById('banner-img').files[0]; let link = document.getElementById('banner-link').value; if(!file) return alert("Image එකක් select කරන්න");
            let reader = new FileReader(); reader.onload = function(e){ banners.push({img: e.target.result, link: link || "#"}); localStorage.setItem("banners", JSON.stringify(banners)); loadBanners(); alert("✅ Banner Added"); }
            reader.readAsDataURL(file);
        }
        function deleteBanner(i){ if(confirm("Delete කරන්නද?")){ banners.splice(i,1); localStorage.setItem("banners", JSON.stringify(banners)); loadBanners(); } }
        function toggleAdmin(){ document.getElementById('adminPanel').style.display = document.getElementById('adminPanel').style.display=='block'?'none':'block'; }
        function topUp(game, enabled, id){
            if(!enabled) return alert("Coming Soon!");
            if(!currentUser) return alert("Please Login first!");
            if(id == 'ffsg'){ window.location.href = 'FreeFireSG.html'; }
            else { let msg = `Hi L2K Creations 🔥\nUser: ${currentUser.user}\nI want to Top Up: ${game}\nMy Game UID: `; window.open(`https://wa.me/94740682507?text=${encodeURIComponent(msg)}`, '_blank'); }
        }

        showUI();
    </script>
</body>
</html>
