<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Order — L2K TOP UP STORE</title><link rel="stylesheet" href="style.css"><script src="orders.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script src="orders.js"></script>
</head><body>
<header class="topbar"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">L2K</span>L2K TOP UP STORE</a><a class="btn btn-light" href="topup.html">← BACK</a></div></header>
<section class="section soft"><div class="container"><div class="section-head"><div class="kicker">— GAME ORDER —</div><h2 id="title">Top Up <span>Game</span></h2><p>Select your package and send your order.</p></div>
<div class="order-box"><div class="form-grid">
<div class="field full"><label>Game</label><input id="game" readonly></div>
<div class="field"><label>Game UID / Player ID</label><input id="uid" placeholder="Enter player ID"></div>
<div class="field"><label>Package</label><select id="pkg"><option>100 Diamonds</option><option>310 Diamonds</option><option>520 Diamonds</option><option>1060 Diamonds</option><option>Custom Package</option></select></div>
<div class="field"><label>Your Name</label><input id="name" placeholder="Your name"></div><div class="field"><label>WhatsApp Number</label><input id="whatsapp" placeholder="07XXXXXXXX"></div>
<div class="field full"><button class="btn btn-primary" onclick="sendOrder()">SEND ORDER TO WHATSAPP →</button></div>
</div></div></div></section>
<script>
const game=new URLSearchParams(location.search).get('game')||localStorage.getItem('selectedGame')||'Game';
document.getElementById('game').value=game;document.getElementById('title').innerHTML='Top Up <span>'+game+'</span>';
async function sendOrder(){
 const uid=document.getElementById('uid').value.trim();
 const name=document.getElementById('name').value.trim();
 const whatsapp=document.getElementById('whatsapp').value.trim();
 const pkg=document.getElementById('pkg').value;
 if(!uid||!name||!whatsapp){alert('Please fill Player ID, Name and WhatsApp number');return}
 try{
   const created=await createStoreOrder({
     type:'game-order',
     game,
     playerId:uid,
     customerName:name,
     whatsapp,
     packageName:pkg,
     items:[{name:pkg,qty:1}],
     total:null,
     currency:'LKR'
   });
   alert('Order placed successfully! Order ID: '+created.id);
 }catch(err){
   console.error(err);
   alert(err.message||'Could not place order');
 }
}
</script><script src="animations.js"></script>
</body></html>
