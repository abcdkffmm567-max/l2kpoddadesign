<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Order — L2K TOP UP STORE</title><link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script src="orders.js"></script>

<!-- L2K PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1688f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="L2K TOPUP">
<link rel="apple-touch-icon" href="./icon-192.png">

</head><body>
<header class="topbar"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">L2K</span>L2K TOP UP STORE</a><a class="btn btn-light" href="topup.html">← BACK</a></div></header>
<section class="section soft"><div class="container"><div class="section-head"><div class="kicker">— GAME ORDER —</div><h2 id="title">Top Up <span>Game</span></h2><p>Select your package and send your order.</p></div>
<div class="order-box"><div class="form-grid">
<div class="field full"><label>Game</label><input id="game" readonly></div>
<div class="field"><label>Game UID / Player ID</label><input id="uid" placeholder="Enter player ID"></div>
<div class="field"><label>Package</label><select id="pkg"><option>100 Diamonds</option><option>310 Diamonds</option><option>520 Diamonds</option><option>1060 Diamonds</option><option>Custom Package</option></select></div>
<div class="field"><label>Your Name</label><input id="name" placeholder="Your name"></div><div class="field"><label>WhatsApp Number</label><input id="whatsapp" placeholder="07XXXXXXXX"></div>
<div class="field full"><button class="btn btn-primary" onclick="sendOrder()">SEND ORDER TO WHATSAPP →</button></div>
</div></div></div></section>
<script>
const game=new URLSearchParams(location.search).get('game')||localStorage.getItem('selectedGame')||'Game';
document.getElementById('game').value=game;
document.getElementById('title').innerHTML='Top Up <span>'+game+'</span>';

function showGameOrderSuccess(orderId){
  const old=document.getElementById('gameOrderSuccess'); if(old) old.remove();
  const box=document.createElement('div');
  box.id='gameOrderSuccess';
  box.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px';
  box.innerHTML=`<div style="background:white;border-radius:20px;padding:26px;text-align:center;max-width:390px;width:100%"><div style="font-size:52px">✅</div><h2>Order Placed!</h2><p style="color:#667085">Your Order ID</p><div style="padding:14px;background:#eef5ff;border-radius:12px;font-size:21px;font-weight:900;color:#1765db;word-break:break-all">${orderId}</div><button id="copyNewOrder" style="margin-top:12px;width:100%;padding:13px;border:0;border-radius:12px;background:#1677f2;color:white;font-weight:900">📋 COPY ORDER ID</button><button id="closeNewOrder" style="margin-top:8px;width:100%;padding:11px;border:1px solid #ddd;border-radius:12px;background:white">CLOSE</button></div>`;
  document.body.appendChild(box);
  box.querySelector('#copyNewOrder').onclick=async function(){
    try{ await copyTextToClipboard(orderId); this.textContent='✓ COPIED'; setTimeout(()=>this.textContent='📋 COPY ORDER ID',1500); }
    catch(e){ window.prompt('Copy your Order ID:',orderId); }
  };
  box.querySelector('#closeNewOrder').onclick=()=>box.remove();
}

async function sendOrder(){
 const uid=document.getElementById('uid').value.trim();
 const name=document.getElementById('name').value.trim();
 const whatsapp=document.getElementById('whatsapp').value.trim();
 const pkg=document.getElementById('pkg').value;
 if(!uid||!name||!whatsapp){alert('Please fill Player ID, Name and WhatsApp number');return}
 try{
   const created=await createStoreOrder({
     type:'game-order',
     game,
     playerId:uid,
     customerName:name,
     whatsapp,
     packageName:pkg,
     items:[{name:pkg,qty:1}],
     total:null,
     currency:'LKR'
   });
   showGameOrderSuccess(created.orderId);
 }catch(err){
   console.error(err);
   alert(err.message||'Could not place order');
 }
}
</script><script src="animations.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js", {scope:"./"})
      .then(function(reg) {
        console.log("L2K service worker registered:", reg.scope);
      })
      .catch(function(err) {
        console.error("L2K service worker registration failed:", err);
      });
  });
}
</script>

</body></html>
